name: Extension quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run check
      - run: npm run compile
      - run: npm run package
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-terminal-x-vsix
          path: '*.vsix'
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Galaxy prompt using Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/galaxy-prompt.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'PowerShell 5.1 syntax check passed.'
